<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotary Melter Workstation 3.0</title><style>
:root{--ink:#183747;--muted:#536c79;--bg:#edf3f5;--line:#d6e1e6;--teal:#007f7b;--dark:#103440;--orange:#bd622c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/2.2 'Segoe UI',system-ui,sans-serif}header{background:var(--dark);color:white;padding:17px 24px;display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}h1{font-size:24px;margin:0}header small{letter-spacing:.14em;color:#9bd7d1}.headRight{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button,.upload{cursor:pointer;padding:9px 13px;border:1px solid #b9ccd4;border-radius:6px;color:var(--ink);background:white}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{opacity:.5;cursor:default}input,select{padding:8px;border:1px solid #b9ccd4;border-radius:5px;color:var(--ink);background:white;max-width:100%}input:focus,button:focus,select:focus{outline:2px solid #0c9790;outline-offset:2px}nav{display:flex;gap:7px;padding:10px 24px;background:white;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:2}nav button{border:0;background:transparent}nav button.active{background:#dcefea;color:#125b55;font-weight:600}.layout{max-width:1740px;margin:auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;padding:18px}aside{position:sticky;top:69px;max-height:calc(100vh - 88px);overflow-y:auto;align-self:start}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:18px 0 9px}p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar label{display:flex;align-items:center;gap:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:13px;border-radius:7px;background:#f0f6f7}.stat small{display:block;color:var(--muted)}.stat b{display:block;font-size:23px;margin:4px 0;font-variant-numeric:tabular-nums}.stat em{font-size:12px;font-style:normal;color:var(--muted)}.status{padding:11px 14px;border-radius:6px;background:#e5f1eb;color:#285c46;margin:10px 0}.warn{background:#fff1d9;color:#79500d;border-left:4px solid #cc961f;padding:12px 15px;margin:10px 0}.error{background:#ffe8e6;color:#8b2c25;border-left:4px solid #bf5149;padding:12px 15px;margin:10px 0}.badge{font-size:12px;color:#286b64;background:#e1f0ed;border-radius:4px;padding:4px 7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:13px 0}.field{font-size:12px;color:var(--muted)}.field span{display:block;min-height:33px}.field input,.field select{width:100%}aside details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}.angleField{grid-column:1/-1}.angleField span{min-height:0;font-size:14px;font-weight:600;color:var(--ink)}.angleControls{display:grid;grid-template-columns:1fr 72px;align-items:center;gap:8px;margin-top:8px}.angleControls input[type=range]{padding:0}canvas{width:100%;height:auto;display:block}.vessel{background:#f1f6f7;border-radius:8px}.chart{height:245px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:right;border-bottom:1px solid var(--line);padding:8px 7px;font-variant-numeric:tabular-nums}td:first-child,th:first-child{text-align:left}th{color:var(--muted)}.formula{font:13px/2.2 Consolas,monospace;background:#eef5f6;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.steps{padding-left:21px}.steps li{margin-bottom:14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photos img{width:100%;height:270px;object-fit:contain;background:#e9eff2}.photos figcaption{font-size:12px;color:var(--muted)}figure{margin:0}pre{overflow:auto;max-height:500px;font-size:12px;background:#f1f5f6;padding:13px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span:before{content:'';display:inline-block;background:var(--c);width:20px;height:3px;margin:0 5px 3px 0}.hidden,[hidden]{display:none!important}#progressBar{width:100%}#stale{position:sticky;top:59px;z-index:1}#surfaceReadout{min-height:22px}.refs li{margin:12px 0}a{color:#007b78}.progress{margin:10px 0}.runwide{width:100%;margin-top:15px}.rec{border-bottom:1px solid var(--line);padding:10px 0}.rec strong{display:block}.rec p{margin:5px 0}.inlineInput{max-width:100px}footer{padding:0 24px 24px;color:var(--muted);font-size:12px}button.linklike{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline}

body{font-size:13px;line-height:1.65;background:#f2f5f8}header{padding:15px 24px;background:linear-gradient(115deg,#102e3d,#174d58)}h1{font-size:22px;letter-spacing:-.02em}header small{font-size:10px;font-weight:700}.panel{border-color:#dce5eb;box-shadow:0 3px 12px #16374d05;border-radius:12px}.layout{max-width:1840px;grid-template-columns:340px minmax(0,1fr)}nav{box-shadow:0 3px 10px #18374708}nav button{border-radius:8px;padding:8px 12px}nav button.active{box-shadow:inset 0 -2px #008b82}.workspaceBar{display:flex;align-items:center;gap:18px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}.workspaceBar .context{flex:1;font-weight:600}.statePill{padding:5px 11px;border-radius:20px;background:#e4f3ec;color:#256449;font-size:12px;font-weight:600}.statePill.changed{background:#fff0d9;color:#875706}.statePill.busy{background:#e3eefb;color:#245e99}.inputTools{border-bottom:1px solid var(--line);padding-bottom:12px}.inputTools input[type=search]{width:100%;margin:8px 0}.inputTools label{font-size:12px}.field.inactive{opacity:.55}.field.inactive:after{content:attr(data-inactive);display:block;font-size:11px}.inputHint{font-size:11px;color:#647b89}.asideActions{position:sticky;bottom:-20px;background:linear-gradient(#fff8,#fff 15%);padding:10px 0;z-index:1}aside details{padding:9px 0}aside summary{font-size:13px}.workspaceGrid{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(300px,1.2fr);gap:18px}.workspaceEditor label{display:block;color:var(--muted);font-size:12px;margin-top:10px}.workspaceEditor input,.workspaceEditor textarea{width:100%;font:inherit;padding:9px;border:1px solid #bdced8;border-radius:6px}.workspaceEditor textarea{resize:vertical;min-height:95px}.workspaceEditor textarea:focus{outline:2px solid #008b82}.scenarioList{display:grid;gap:9px;max-height:520px;overflow:auto}.scenarioRow{border:1px solid var(--line);border-radius:9px;padding:12px}.scenarioRow strong{display:block}.scenarioRow p{white-space:pre-wrap
